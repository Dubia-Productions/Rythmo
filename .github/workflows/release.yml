name: Build and release

on:
  push:
    branches: [Release]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: rythmo-build-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            platform: windows
            arch: x64
            script: build-windows-x64.bat
          - name: Windows ARM64
            os: windows-11-arm
            platform: windows
            arch: arm64
            script: build-windows-arm64.bat
          - name: macOS Intel
            os: macos-15-intel
            platform: macos
            arch: x64
            script: build-macos-intel.sh
          - name: macOS Apple Silicon
            os: macos-15
            platform: macos
            arch: arm64
            script: build-macos-silicon.sh
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
            script: build-linux-x64.sh
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            script: build-linux-arm64.sh

    runs-on: ${{ matrix.os }}
    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/tools/python-runtime
          key: python-runtime-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('prepare-python-runtime.sh') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Windows Qt SDK
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-windows-${{ matrix.arch }}-6.8.3-${{ runner.os }}
      - name: Cache Linux Qt and build tools
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            build/tools/Qt/6.8.3
            build/tools/build-env
          key: qt-linux-${{ matrix.arch }}-6.8.3-${{ runner.os }}
      - name: Cache macOS Qt SDK and build tools
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            build/tools/Qt/6.8.3
            build/tools/build-env
            ~/Library/Caches/Homebrew
          key: qt-macos-${{ matrix.arch }}-6.8.3-${{ runner.os }}-${{ hashFiles('build-macos-*.sh') }}
      - name: Cache Windows vcpkg dependencies
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            build/tools/vcpkg/installed
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-windows-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-${{ matrix.arch }}-

      - name: Set build version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.4.0"; fi
          echo "RYTHMO_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call ${{ matrix.script }}

      - name: Build and test on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        run: sh "${{ matrix.script }}"

      - name: Prepare Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $version = $env:RYTHMO_VERSION
          if ($arch -eq 'x64') { $app = Join-Path $PWD 'dist/Rythmo-by-Dubia-Productions-windows-x64-v8' }
          else { $app = Join-Path $PWD 'build/release-windows-arm64/Release' }
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          $qtArch = if ($arch -eq 'x64') { 'msvc2022_64' } else { 'msvc2022_arm64' }
          $deployPath = Join-Path $env:USERPROFILE "Qt/6.8.3/$qtArch/bin/windeployqt.exe"
          if (-not (Test-Path -LiteralPath $deployPath)) { $deployPath = "C:/Qt/6.8.3/$qtArch/bin/windeployqt.exe" }
          if (-not (Test-Path -LiteralPath $deployPath)) {
            $deployItem = Get-ChildItem -Path @((Join-Path $env:USERPROFILE 'Qt'), 'C:/Qt') -Filter windeployqt.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($deployItem) { $deployPath = $deployItem.FullName }
          }
          if (-not (Test-Path -LiteralPath $deployPath)) { throw "windeployqt.exe was not found for $qtArch." }
          & $deployPath --release --multimedia --multimediawidgets (Join-Path $app 'Rythmo.exe')
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed.' }
          $target = if ($arch -eq 'x64') { 'win64' } else { 'winarm64' }
          $archiveName = "ffmpeg-n9.0-latest-$target-gpl-9.0.zip"
          $release = Invoke-RestMethod 'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest'
          $archiveAsset = $release.assets | Where-Object name -eq $archiveName | Select-Object -First 1
          $checksumsAsset = $release.assets | Where-Object name -eq 'checksums.sha256' | Select-Object -First 1
          if (-not $archiveAsset -or -not $checksumsAsset) { throw "Static FFmpeg package unavailable: $archiveName" }
          $ffmpegTemp = Join-Path $env:RUNNER_TEMP "ffmpeg-$arch"
          New-Item -ItemType Directory -Force -Path $ffmpegTemp | Out-Null
          $archivePath = Join-Path $ffmpegTemp $archiveName
          $checksumsPath = Join-Path $ffmpegTemp 'checksums.sha256'
          Invoke-WebRequest $archiveAsset.browser_download_url -OutFile $archivePath
          Invoke-WebRequest $checksumsAsset.browser_download_url -OutFile $checksumsPath
          $checksumLine = Get-Content $checksumsPath | Where-Object { $_ -match [regex]::Escape($archiveName) } | Select-Object -First 1
          $expectedHash = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $expectedHash -or $actualHash -ne $expectedHash) { throw "FFmpeg SHA-256 check failed for $archiveName" }
          Expand-Archive -Path $archivePath -DestinationPath $ffmpegTemp -Force
          $ffmpegExe = Get-ChildItem -Path $ffmpegTemp -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path $ffmpegTemp -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
          if (-not $ffmpegExe -or -not $ffprobeExe) { throw 'Static FFmpeg executables were not found.' }
          $encoders = (& $ffmpegExe.FullName -hide_banner -encoders 2>&1) -join "`n"
          foreach ($encoder in @('libx264', 'libx265', 'libsvtav1')) {
            if ($encoders -notmatch [regex]::Escape($encoder)) { throw "Bundled FFmpeg lacks $encoder." }
          }
          Copy-Item $ffmpegExe.FullName (Join-Path $app 'ffmpeg.exe') -Force
          Copy-Item $ffprobeExe.FullName (Join-Path $app 'ffprobe.exe') -Force
          Get-ChildItem -LiteralPath $app -Filter '*.pdb' -File -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          $stage = Join-Path $PWD "package/Rythmo-windows-$arch"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $app '*') $stage -Recurse -Force
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "Rythmo-windows-$arch-portable.zip" -Force
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DPackageDir=$stage" "/DOutputFile=Rythmo-windows-$arch-setup" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }

      - name: Prepare macOS packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch_name='${{ matrix.arch }}'
          if [ "$arch_name" = x64 ]; then build_arch=intel; source_arch=amd64; build_id=1789931006; else build_arch=arm64; source_arch=arm64; build_id=1789931890; fi
          app="$HOME/Library/Caches/Rythmo/build/release-macos-$build_arch/Rythmo.app"
          test -d "$app"
          ffmpeg_temp="$(mktemp -d)"
          for tool in ffmpeg ffprobe; do
            url="https://ffmpeg.martin-riedl.de/download/macos/$source_arch/${build_id}_9.0.2/$tool.zip"
            curl -fsSL "$url" -o "$ffmpeg_temp/$tool.zip"
            curl -fsSL "$url.sha256" -o "$ffmpeg_temp/$tool.zip.sha256"
            expected="$(awk 'NR == 1 { print $1 }' "$ffmpeg_temp/$tool.zip.sha256")"
            actual="$(shasum -a 256 "$ffmpeg_temp/$tool.zip" | awk '{ print $1 }')"
            [ -n "$expected" ] && [ "$actual" = "$expected" ] || { echo "FFmpeg checksum failed: $tool" >&2; exit 1; }
            mkdir -p "$ffmpeg_temp/$tool"
            unzip -q "$ffmpeg_temp/$tool.zip" -d "$ffmpeg_temp/$tool"
            binary="$(find "$ffmpeg_temp/$tool" -type f -name "$tool" -perm -111 -print -quit)"
            [ -n "$binary" ] || { echo "Bundled $tool executable not found." >&2; exit 1; }
            install -m 755 "$binary" "$app/Contents/MacOS/$tool"
          done
          encoders="$("$app/Contents/MacOS/ffmpeg" -hide_banner -encoders 2>&1)"
          for encoder in libx264 libx265 libsvtav1 h264_videotoolbox hevc_videotoolbox; do
            printf '%s\n' "$encoders" | grep -q "$encoder" || { echo "Bundled FFmpeg lacks $encoder." >&2; exit 1; }
          done
          "$app/Contents/MacOS/ffprobe" -version >/dev/null
          rm -rf "$ffmpeg_temp"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
          release_arch="$arch_name"
          ditto -c -k --sequesterRsrc --keepParent "$app" "Rythmo-macos-$release_arch.zip"

      - name: Prepare Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          arch_name='${{ matrix.arch }}'
          if [ "$arch_name" = arm64 ]; then build=build/release-linux-arm64; ffmpeg_target=linuxarm64; else build=build/release-linux-x64; ffmpeg_target=linux64; fi
          app_dir="package/Rythmo-linux-$arch_name"
          mkdir -p "$app_dir"
          install -m 755 "$build/Rythmo" "$app_dir/Rythmo.bin"
          install -m 644 resources/RYTHMO_LOGO_PNG-ROUNDED.png "$app_dir/rythmo-icon.png"
          install -m 644 packaging/linux/rythmo.desktop "$app_dir/rythmo.desktop"
          touch "$app_dir/.rythmo-portable"
          cat > "$app_dir/Rythmo" <<'LAUNCHER'
          #!/bin/sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then export LD_LIBRARY_PATH="$ROOT/lib:$LD_LIBRARY_PATH"; else export LD_LIBRARY_PATH="$ROOT/lib"; fi
          export QT_PLUGIN_PATH="$ROOT/plugins"
          export QT_QPA_PLATFORM_PLUGIN_PATH="$ROOT/plugins/platforms"
          exec "$ROOT/Rythmo.bin" "$@"
          LAUNCHER
          chmod 755 "$app_dir/Rythmo"
          printf '[Paths]\nPlugins=plugins\nLibraries=lib\n' > "$app_dir/qt.conf"

          archive_name="ffmpeg-n9.0-latest-$ffmpeg_target-gpl-9.0.tar.xz"
          release_json="$(curl -fsSL https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest)"
          archive_url="$(python3 -c 'import json,sys; n=sys.argv[1]; d=json.load(sys.stdin); print(next(a["browser_download_url"] for a in d["assets"] if a["name"]==n))' "$archive_name" <<< "$release_json")"
          checksum_url="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(a["browser_download_url"] for a in d["assets"] if a["name"]=="checksums.sha256"))' <<< "$release_json")"
          ffmpeg_temp="$(mktemp -d)"
          curl -fsSL "$archive_url" -o "$ffmpeg_temp/$archive_name"
          curl -fsSL "$checksum_url" -o "$ffmpeg_temp/checksums.sha256"
          expected="$(awk -v n="$archive_name" '$NF == n || $NF == "*" n { print $1; exit }' "$ffmpeg_temp/checksums.sha256")"
          actual="$(sha256sum "$ffmpeg_temp/$archive_name" | awk '{ print $1 }')"
          [ -n "$expected" ] && [ "$actual" = "$expected" ] || { echo "FFmpeg checksum failed." >&2; exit 1; }
          mkdir -p "$ffmpeg_temp/unpacked"
          tar -xJf "$ffmpeg_temp/$archive_name" -C "$ffmpeg_temp/unpacked"
          ffmpeg_bin="$(find "$ffmpeg_temp/unpacked" -type f -name ffmpeg -perm -111 -print -quit)"
          ffprobe_bin="$(find "$ffmpeg_temp/unpacked" -type f -name ffprobe -perm -111 -print -quit)"
          [ -n "$ffmpeg_bin" ] && [ -n "$ffprobe_bin" ] || { echo "Static FFmpeg tools not found." >&2; exit 1; }
          encoders="$("$ffmpeg_bin" -hide_banner -encoders 2>&1)"
          for encoder in libx264 libx265 libsvtav1; do
            printf '%s\\n' "$encoders" | grep -q "$encoder" || { echo "Bundled FFmpeg lacks $encoder." >&2; exit 1; }
          done
          install -m 755 "$ffmpeg_bin" "$app_dir/ffmpeg"
          install -m 755 "$ffprobe_bin" "$app_dir/ffprobe"

          qt_core="$(ldd "$build/Rythmo" | awk '$1 == "libQt6Core.so.6" && $2 == "=>" { print $3; exit }')"
          [ -n "$qt_core" ] || { echo "Qt Core runtime library was not found." >&2; exit 1; }
          qt_lib_dir="$(dirname "$(readlink -f "$qt_core")")"
          qt_prefix="$(dirname "$qt_lib_dir")"
          qt_plugins="$qt_prefix/plugins"
          if [ ! -d "$qt_plugins/platforms" ]; then qt_plugins="$qt_prefix/qt6/plugins"; fi
          if [ ! -d "$qt_plugins/platforms" ]; then
            qt_qxcb="$(find /usr -type f -path '*/plugins/platforms/libqxcb.so' -print -quit 2>/dev/null || true)"
            [ -n "$qt_qxcb" ] || { echo "Qt platform plugins were not found for the linked SDK." >&2; exit 1; }
            qt_plugins="$(dirname "$(dirname "$qt_qxcb")")"
          fi
          mkdir -p "$app_dir/plugins"
          for plugin_group in platforms multimedia imageformats networkinformation tls xcbglintegrations; do
            if [ -d "$qt_plugins/$plugin_group" ]; then cp -R "$qt_plugins/$plugin_group" "$app_dir/plugins/"; fi
          done
          [ -f "$app_dir/plugins/platforms/libqxcb.so" ] || { echo "The Qt xcb platform plugin was not bundled." >&2; exit 1; }
          python3 packaging/linux/bundle-runtime.py "$app_dir"
          "$app_dir/ffprobe" -version >/dev/null
          tar -C package -czf "Rythmo-linux-$arch_name-portable.tar.gz" "Rythmo-linux-$arch_name"
          tar -tzf "Rythmo-linux-$arch_name-portable.tar.gz" | grep -q "Rythmo-linux-$arch_name/.rythmo-portable"
          tar -tzf "Rythmo-linux-$arch_name-portable.tar.gz" | grep -q "Rythmo-linux-$arch_name/Rythmo.bin"
          rm -rf "$ffmpeg_temp"

      - uses: actions/upload-artifact@v4
        with:
          name: Rythmo-${{ matrix.platform }}-${{ matrix.arch }}
          path: Rythmo-*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Rythmo-*
          merge-multiple: true
      - name: Publish platform installers and portable packages
        uses: softprops/action-gh-release@v2
        with:
          files: Rythmo-*
          fail_on_unmatched_files: true

