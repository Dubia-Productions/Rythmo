name: Build and release

on:
  push:
    branches: [Release]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            arch: x64
            script: build-windows-x64.bat
          - name: Windows ARM64
            os: windows-11-arm
            platform: windows
            arch: arm64
            script: build-windows-arm64.bat
          - name: macOS Intel
            os: macos-15-intel
            platform: macos
            arch: intel
            script: build-macos-intel.sh
          - name: macOS Apple Silicon
            os: macos-15
            platform: macos
            arch: arm64
            script: build-macos-silicon.sh
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            script: build-linux-x64.sh
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            script: build-linux-arm64.sh

    runs-on: ${{ matrix.os }}
    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set build version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.3.1"; fi
          echo "RYTHMO_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call ${{ matrix.script }}

      - name: Build and test on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        run: sh "${{ matrix.script }}"

      - name: Prepare Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $version = $env:RYTHMO_VERSION
          if ($arch -eq 'x64') { $app = Join-Path $PWD 'dist/Rythmo-by-Dubia-Productions-windows-x64-v8' }
          else { $app = Join-Path $PWD 'build/release-windows-arm64/Release' }
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          if ($arch -eq 'arm64') { Copy-Item 'build/release-windows-arm64/Release/Rythmo.exe' $app -Force }
          $deploy = Get-ChildItem -Path @($env:USERPROFILE + '/Qt', 'C:/Qt') -Filter windeployqt.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $deploy) { throw 'windeployqt.exe was not found.' }
          & $deploy.FullName --release --multimedia --multimediawidgets (Join-Path $app 'Rythmo.exe')
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed.' }
          choco install ffmpeg -y --no-progress
          $ffmpeg = (Get-Command ffmpeg.exe -ErrorAction Stop).Source
          $ffprobe = (Get-Command ffprobe.exe -ErrorAction Stop).Source
          Copy-Item $ffmpeg $app -Force
          Copy-Item $ffprobe $app -Force
          $stage = Join-Path $PWD "package/Rythmo-windows-$arch"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $app '*') $stage -Recurse -Force
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "Rythmo-windows-$arch-portable.zip" -Force
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DPackageDir=$stage" "/DOutputFile=Rythmo-windows-$arch-setup" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }

      - name: Prepare macOS packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch_name='${{ matrix.arch }}'
          if [ "$arch_name" = intel ]; then artifact_arch=intel; else artifact_arch=arm64; fi
          app="build/release-macos-$artifact_arch/Rythmo.app"
          test -d "$app"
          ffmpeg_bin="$(brew --prefix ffmpeg)/bin"
          install -m 755 "$ffmpeg_bin/ffmpeg" "$app/Contents/MacOS/ffmpeg"
          install -m 755 "$ffmpeg_bin/ffprobe" "$app/Contents/MacOS/ffprobe"
          find "$app/Contents" -type f \( -name "*.dylib" -o -name ffmpeg -o -name ffprobe -o -name Rythmo \) -print0 | while IFS= read -r -d "" binary; do
            codesign --force --sign - --timestamp=none "$binary"
          done
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
          if [ "$artifact_arch" = intel ]; then release_arch=x64; else release_arch=arm64; fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "Rythmo-macos-$release_arch-portable.zip"
          hdiutil create -volname Rythmo -srcfolder "$app" -ov -format UDZO "Rythmo-macos-$release_arch-setup.dmg"

      - name: Prepare Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          arch_name='${{ matrix.arch }}'
          if [ "$arch_name" = arm64 ]; then build=build/release-linux-arm64; deb_arch=arm64; else build=build/release-linux-x64; deb_arch=amd64; fi
          mkdir -p "package/Rythmo-linux-$arch_name" "package/deb/DEBIAN" "package/deb/usr/bin"
          install -m 755 "$build/Rythmo" "package/Rythmo-linux-$arch_name/Rythmo"
          install -m 644 resources/rythmo-icon.png "package/Rythmo-linux-$arch_name/rythmo-icon.png"
          install -m 644 packaging/linux/rythmo.desktop "package/Rythmo-linux-$arch_name/rythmo.desktop"
          tar -C package -czf "Rythmo-linux-$arch_name-portable.tar.gz" "Rythmo-linux-$arch_name"
          install -m 755 "$build/Rythmo" package/deb/usr/bin/Rythmo
          mkdir -p package/deb/usr/share/applications package/deb/usr/share/icons/hicolor/512x512/apps
          install -m 644 packaging/linux/rythmo.desktop package/deb/usr/share/applications/rythmo.desktop
          install -m 644 resources/rythmo-icon.png package/deb/usr/share/icons/hicolor/512x512/apps/rythmo.png
          printf 'Package: rythmo\nVersion: %s\nArchitecture: %s\nMaintainer: Dubia Productions\nDepends: libc6, libexpat1, libqt6core6, libqt6gui6, libqt6widgets6, libqt6multimedia6, libqt6multimediawidgets6, ffmpeg\nDescription: Rythmo dubbing cue sheet and local voice separation\n' "$RYTHMO_VERSION" "$deb_arch" > package/deb/DEBIAN/control
          dpkg-deb --build package/deb "Rythmo-linux-$arch_name-setup.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: Rythmo-${{ matrix.platform }}-${{ matrix.arch }}
          path: Rythmo-*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Rythmo-*
          merge-multiple: true
      - name: Publish platform installers and portable packages
        uses: softprops/action-gh-release@v2
        with:
          files: Rythmo-*
          fail_on_unmatched_files: true
